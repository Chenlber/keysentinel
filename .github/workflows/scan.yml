name: KeySentinel Scan

on:
  workflow_dispatch:
    inputs:
      crawl_queries:
        description: 'Crawler 查询数（0 = 跳过采集只跑下游检测）'
        required: false
        default: '0'
      crawl_pages:
        description: 'Crawler 每查询页数（1 = 浅扫 100 条/查询，10 = 全量 1000 条/查询）'
        required: false
        default: '10'
  schedule:
    - cron: '30 2 * * 1'   # 每周一 02:30 UTC（北京 10:30）

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 缓存 data/：断点续跑 + 增量 crawler 的关键。
      # key 带 run_id 保证每次 miss → 从 restore-keys 恢复最近缓存 → 结束后保存新版本。
      - name: Cache scan data
        uses: actions/cache@v5
        with:
          path: data
          key: keysentinel-data-${{ github.run_id }}
          restore-keys: |
            keysentinel-data-

      - name: Crawler (incremental)
        if: ${{ inputs.crawl_queries != '0' && inputs.crawl_queries != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          CRAWL_LIMIT_QUERIES: ${{ inputs.crawl_queries }}
          CRAWL_LIMIT_PAGES: ${{ inputs.crawl_pages }}
        run: python3 crawler.py

      # 下游步骤仅在输入数据存在时运行（首次运行无数据时跳过，避免 exit 1）
      - name: Extract keys
        if: hashFiles('data/raw_items.jsonl') != ''
        run: python3 extractor.py

      - name: Verify (zero-cost, quiet)
        if: hashFiles('data/keys.jsonl') != ''
        env:
          QUIET: '1'
        run: python3 verifier.py

      - name: Generate report
        if: hashFiles('data/verified.jsonl') != ''
        run: python3 reporter.py

      # 更新历史汇总与 README 动态区块，commit 回仓库
      - name: Update history & README
        if: hashFiles('data/verified.jsonl') != ''
        run: |
          python3 update_history.py
          python3 update_readme.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/valid_keys.json README.md
          git diff --cached --quiet || git commit -m "chore: update valid keys history [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      # 不上传 artifact：完整报告含仓库/文件路径，公开仓库下任何人可下载。
      # 只输出脱敏的 Summary（valid key 数量 + 仓库名，无 key 明文）。
      - name: Summary
        if: always()
        run: |
          echo "## 扫描结果" >> $GITHUB_STEP_SUMMARY
          python3 - <<'EOF'
          import json, os
          valid = 0
          valid_repos = []
          p = 'data/verified.jsonl'
          if os.path.exists(p):
              for line in open(p):
                  rec = json.loads(line)
                  if rec.get('status') == 'valid':
                      valid += 1
                      valid_repos.append(rec.get('repo', '?'))
          import hashlib
          lines = [f"### valid keys: **{valid}**", ""]
          if valid_repos:
              lines.append("涉及仓库（sha256 前 8 位，保护维护者）：")
              for r in valid_repos:
                  rh = hashlib.sha256(r.encode()).hexdigest()[:8]
                  lines.append(f"- `{rh}`")
              lines.append("")
              lines.append("> 仓库名不在公开日志中暴露；完整数据在本地 data/（不上传）。")
              lines.append("")
          if not os.path.exists('data/raw_items.jsonl'):
              lines.append("> 首次运行且未指定采集量（crawl_queries=0），无数据。请用 crawl_queries>0 重跑采集，或等待定时任务。")
          lines.append("如需通知，请在本地运行 notify.py，或在 Actions 手动触发 notify workflow（需审批）。")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write("\n".join(lines) + "\n")
          EOF
