name: KeySentinel Scan

on:
  workflow_dispatch:
    inputs:
      crawl_queries:
        description: 'Crawler 查询数（0 = 跳过采集只跑下游检测）'
        required: false
        default: '0'
  schedule:
    - cron: '30 2 * * 1'   # 每周一 02:30 UTC（北京 10:30）

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 缓存 data/：断点续跑 + 增量 crawler 的关键。
      # key 带 run_id 保证每次 miss → 从 restore-keys 恢复最近缓存 → 结束后保存新版本。
      - name: Cache scan data
        uses: actions/cache@v4
        with:
          path: data
          key: keysentinel-data-${{ github.run_id }}
          restore-keys: |
            keysentinel-data-

      - name: Crawler (incremental)
        if: ${{ inputs.crawl_queries != '0' && inputs.crawl_queries != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_PAT }}
          CRAWL_LIMIT_QUERIES: ${{ inputs.crawl_queries }}
          CRAWL_LIMIT_PAGES: '1'
        run: python3 crawler.py

      - name: Extract keys
        run: python3 extractor.py

      - name: Verify (zero-cost, quiet)
        env:
          QUIET: '1'
        run: python3 verifier.py

      - name: Generate report
        run: python3 reporter.py

      # 不上传 artifact：完整报告含仓库/文件路径，公开仓库下任何人可下载。
      # 只输出脱敏的 Summary（valid key 数量 + 仓库名，无 key 明文）。
      - name: Summary
        run: |
          echo "## 扫描结果" >> $GITHUB_STEP_SUMMARY
          python3 - <<'EOF'
          import json, os
          valid = 0
          valid_repos = []
          p = 'data/verified.jsonl'
          if os.path.exists(p):
              for line in open(p):
                  rec = json.loads(line)
                  if rec.get('status') == 'valid':
                      valid += 1
                      valid_repos.append(rec.get('repo', '?'))
          lines = [f"### valid keys: **{valid}**", ""]
          if valid_repos:
              lines.append("涉及仓库（脱敏）：")
              for r in valid_repos:
                  lines.append(f"- `{r}`")
              lines.append("")
          lines.append("如需通知，请在本仓库 secrets 配置 GITHUB_PAT 后在本地运行 notify.py（CI 不自动通知）。")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write("\n".join(lines) + "\n")
          EOF
